[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Command line options
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# Markers
markers =
    HomePageComboPack1: test pack
    HomePageSearchRegressionPackage: test test pack
    HomePageLanguagesRegressionPackage: test pack
    smoke: Quick smoke tests
    regression: Full regression tests
    CozevaComboPack1: Combo of most base regression tests
    SidebarRegressionPackage: Sidebar related regression tests
    AnalyticsTestPackage: Analytics related regression tests
    BridgeRegressionPackage: Bridge related regression tests
    RegistriesTestPackage: Registries related regression tests
    ChartListRegressionPackage: Chart list related regression tests
    NavigationsRegressionPackage: Navigations related regression tests
    RegistriesRegressionPackage: Registries related regression tests
    PatientDashboardTestPackage: Patient dashboard related regression tests







# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Console output
console_output_style = progress

# Timeout (if using pytest-timeout plugin)
# timeout = 300
