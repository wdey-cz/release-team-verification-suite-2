[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Command line options
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# Markers
markers =
    CozevaComboPack1: Combo of most base regression tests
    CozevaComboPack2: Alternate Combo pack, not defined.
    SidebarTestPackage: Sidebar related regression tests
        SupportSidebar: Support sidebar cases
        PracticeSidebar: Practice sidebar cases
        ProviderSidebar: Provider sidebar cases
    RegistriesTestPackage: Registries related regression tests
	    SupportRegistries: Support registries cases
    GlobalSearchTestPackage: Global search related regression tests
	    GlobalSearch: Global search cases
    PatientDashboardTestPackage: Patient dashboard related regression tests
        PatientDashboard: Patient dashboard cases
    GeneralNavPackage: General navigation related regression tests
        SupportRegistryNavs: Support registry navigation cases
        PracticeRegistryNavs: Practice registry navigation cases
        ProviderRegistryNavs: Provider registry navigation cases
    ApptrayTestPackage: Apptray related regression tests
    AnalyticsTestPackage: Analytics related regression tests (WIP)
        AnalyticsLandingPage: Analytics landing page cases (WIP)
    HomePageComboPack1: Home page related regression tests (WIP)
        HomePageSearchRegressionPackage: Home page search regression cases (WIP)
        HomePageLanguagesRegressionPackage: Home page languages regression cases (WIP)










# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Console output
console_output_style = progress

# Timeout (if using pytest-timeout plugin)
# timeout = 300
